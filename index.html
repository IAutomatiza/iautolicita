    <!-- iOS ignora el SVG: para "Añadir a pantalla de inicio" pide PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Analytics 4 · G-T6H147Q2TG
         Va en el index porque el prerenderizado lo copia a las 28
         páginas: una sola etiqueta, sin repetirla por ruta.

         `send_page_view: false` es a propósito. gtag mandaría la
         primera vista solo, y en un sitio de una sola página eso
         significa que navegar entre fichas del glosario no contaría
         como visita: Google creería que todos entran y se quedan
         donde cayeron. Las vistas las manda `vistaPagina()` en cada
         cambio de ruta, incluida la primera. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T6H147Q2TG', { send_page_view: false });
      /* gtag.js (194 KB) se baja DESPUÉS de que la página cargó: bajado
         junto con el sitio competía con el título y la portada medía
         LCP 4 s en móvil. No se pierde nada: todo lo que se mande antes
         queda en `dataLayer` y gtag lo procesa al llegar (mismo esquema
         que el sitio de SVEA). */
      (function () {
        var hecho = false;
        function cargar() {
          if (hecho) return; hecho = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-T6H147Q2TG';
          document.head.appendChild(s);
        }
        function pronto() { ('requestIdleCallback' in window) ? requestIdleCallback(cargar, { timeout: 2500 }) : setTimeout(cargar, 1500); }
        if (document.readyState === 'complete') pronto();
        else window.addEventListener('load', pronto, { once: true });
        ['pointerdown', 'keydown', 'scroll'].forEach(function (ev) {
          window.addEventListener(ev, cargar, { once: true, passive: true });
        });
        setTimeout(cargar, 6000);
      })();
    </script>
