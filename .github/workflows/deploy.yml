name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: GitHub Pages serves 404.html for unknown deep links,
      # which loads the app and lets React Router handle the route.
      - run: cp dist/index.html dist/404.html
      # /lici y /precios llegaban por ese fallback y respondían HTTP
      # 404, lo que las deja fuera del índice y rompe la vista previa
      # al compartirlas. Con su propio index.html devuelven 200.
      - run: |
          for ruta in lici precios; do
            mkdir -p "dist/$ruta" && cp dist/index.html "dist/$ruta/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
