name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pages sirve en un subdirectorio: sin esto los assets dan 404.
      #
      # Desde que el sitio vive en www.iautolicita.cl (Vercel), esta
      # copia es SOLO vista previa. SITIO_NOINDEX la saca de Google:
      # deja robots.txt en Disallow y cada página con noindex.
      # Sin esto habría dos copias del mismo texto compitiendo entre
      # sí, y Google puede quedarse con la de github.io.
      - run: npm run build
        env:
          BASE_SITIO: /iautolicita/
          SITE_URL: https://iautomatiza.github.io/iautolicita
          SITIO_NOINDEX: "1"
      # SPA fallback: Pages sirve 404.html en cualquier ruta que no
      # exista como archivo, y ahí React Router se hace cargo.
      - run: cp dist/index.html dist/404.html
      # El prerenderizado (dentro de `npm run build`) ya deja cada ruta
      # con su propio index.html — antes esto se hacía a mano acá para
      # lici y precios. Ahora son seis y salen con su HTML de verdad,
      # no con una copia del home.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
